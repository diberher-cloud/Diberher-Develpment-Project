[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outbound-backend"
version = "0.1.0"
description = "API de la plataforma de campañas outbound (contact center, Colombia)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<1.17",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.10,<2.12",
    "pydantic-settings>=2.6,<2.10",
    "email-validator>=2.2,<3",
    "pyjwt>=2.10,<3",
    "bcrypt>=4.2,<5",
    "python-multipart>=0.0.18,<0.1",
    "phonenumbers>=8.13,<9",
    "tzdata>=2024.2",
    "twilio>=9.3,<10",
    "openpyxl>=3.1,<3.2",
    "defusedxml>=0.7,<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.29",
    "ruff>=0.8,<0.13",
    "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requiere PostgreSQL (TEST_DATABASE_URL); se omite si no existe"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
