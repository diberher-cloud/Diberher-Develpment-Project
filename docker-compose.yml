# Desarrollo local. Copie `.env.example` a `.env` y defina JWT_SECRETO antes de `docker compose up`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outbound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outbound}
      POSTGRES_DB: ${POSTGRES_DB:-outbound}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENTORNO: ${ENTORNO:-desarrollo}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-outbound}:${POSTGRES_PASSWORD:-outbound}@db:5432/${POSTGRES_DB:-outbound}
      JWT_SECRETO: ${JWT_SECRETO:?Defina JWT_SECRETO (>= 32 caracteres) en .env}
      JWT_EXPIRACION_MINUTOS: ${JWT_EXPIRACION_MINUTOS:-480}
      BCRYPT_COSTE: ${BCRYPT_COSTE:-12}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:5173}
      IMPORTACION_MAX_BYTES: ${IMPORTACION_MAX_BYTES:-10485760}
      IMPORTACION_MAX_FILAS: ${IMPORTACION_MAX_FILAS:-50000}
      EXCLUSIONES_MAX_FILAS: ${EXCLUSIONES_MAX_FILAS:-200000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli generar-festivos --desde 2025 --hasta 2028 &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
