# Desarrollo local. Copie `.env.example` a `.env` y defina JWT_SECRETO antes de `docker compose up`.
# `backend` y `worker` comparten `env_file` (requiere Docker Compose >= 2.24 por `required: false`):
# así toda variable del `.env` (TELEFONIA_*, TWILIO_*, WHATSAPP_*, WORKER_*, ...) llega a ambos
# contenedores. `Settings` ignora las variables ajenas (POSTGRES_*, VITE_*).
x-backend-comun: &backend-comun
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-outbound}:${POSTGRES_PASSWORD:-outbound}@db:5432/${POSTGRES_DB:-outbound}
    JWT_SECRETO: ${JWT_SECRETO:?Defina JWT_SECRETO (>= 32 caracteres) en .env}
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outbound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outbound}
      POSTGRES_DB: ${POSTGRES_DB:-outbound}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-comun
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli generar-festivos --desde 2025 --hasta 2028 &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  worker:
    <<: *backend-comun
    depends_on:
      backend:
        condition: service_healthy   # las migraciones las aplica `backend`
    command: python -m app.worker
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
